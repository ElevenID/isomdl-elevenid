name: Organization quality

on:
  pull_request:
  push:
    branches: [main]
  # Synchronization pull requests are created with GITHUB_TOKEN, which does
  # not recursively trigger pull_request workflows. The sync workflow
  # dispatches this check against the exact synchronization branch instead.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    uses: ElevenID/.github/.github/workflows/quality-workflows.yml@9b6141e294da5c0f9254cfaa60c8934df95ec68b
    with:
      policy-ref: 9b6141e294da5c0f9254cfaa60c8934df95ec68b
