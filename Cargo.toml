[package]
name = "isomdl"
version = "0.2.0"
edition = "2021"
description = "ISO mDL implementation in Rust"
readme = "README.md"
homepage = "https://github.com/spruceid/isomdl"
repository = "https://github.com/spruceid/isomdl"
documentation = "https://docs.rs/isomdl"
license = "Apache-2.0 OR MIT"
exclude = ["test/"]
autotests = false

[features]
default = ["presentation-verifier"]
issuer-planning = ["dep:p521", "dep:rand"]
presentation-verifier = []
session-key-agreement = [
    "presentation-verifier",
    "dep:aes",
    "dep:aes-gcm",
    "dep:aws-lc-rs",
    "dep:ghash",
    "dep:asn1-rs",
    "dep:hkdf",
    "dep:hmac",
    "dep:rand",
    "dep:polyval",
    "dep:subtle",
    "p256/ecdh",
    "p384/ecdh",
    "dep:zeroize",
]
cli = ["session-key-agreement", "dep:clap", "dep:clap-stdin"]
parallel = ["issuer-planning", "dep:rayon"]
simd = ["issuer-planning", "dep:wide"]

[package.metadata.cargo-machete]
# Attribute and proc-macro references are not visible to cargo-machete.
# GHASH/POLYVAL are direct feature carriers that zeroize AES-GCM key schedules;
# production code intentionally does not import their APIs.
ignored = ["ghash", "polyval", "serde_bytes", "strum"]

[[bin]]
name = "isomdl-utils"
path = "src/bin/utils.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0"
ecdsa = { version = "0.16.9", default-features = false, features = ["serde", "verifying"] }
p256 = { version = "0.13.0", default-features = false, features = ["arithmetic", "ecdsa-core", "pkcs8", "serde", "std"] }
p384 = { version = "0.13.0", default-features = false, features = ["arithmetic", "ecdsa-core", "pkcs8", "serde", "std"] }
p521 = { version = "0.13.3", default-features = false, features = ["arithmetic", "ecdsa-core"], optional = true }
rand = { version = "0.8.5", features = ["getrandom"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11.0"
sha2 = { version = "0.10.8", features = ["compress", "oid"] }
thiserror = "1.0"
elliptic-curve = "0.13.1"
aes-gcm = { version = "0.10.1", features = ["zeroize"], optional = true }
hkdf = { version = "0.12.3", optional = true }
hmac = { version = "0.12.1", features = ["reset"], optional = true }
aes = { version = "0.8.2", features = ["zeroize"], optional = true }
ghash = { version = "0.5.1", features = ["zeroize"], optional = true }
polyval = { version = "0.6.2", features = ["zeroize"], optional = true }
zeroize = { version = "1.8", features = ["alloc", "derive"], optional = true }
sec1 = "0.7.1"
uuid = { version = "1.3", features = ["v1", "v4", "std", "rng", "serde", "js"] }
time = { version = "0.3.20", features = ["formatting", "parsing", "macros"] }
signature = { version = "2.0.0", features = ["std"] }
#tracing = "0.1"
base64 = "0.13"
pem-rfc7468 = "0.7.0"
x509-cert = { version = "0.2.4", features = ["pem"] }
isomdl-macros = { version = "0.1.0", path = "macros" }
clap = { version = "4", features = ["derive"], optional = true }
clap-stdin = { version = "0.2.1", optional = true }
const-oid = "0.9.2"
der = { version = "0.7", features = ["std", "derive", "alloc"] }
hex = "0.4.3"
asn1-rs = { version = "0.5.2", features = ["bits"], optional = true }

strum = "0.24"
strum_macros = "0.24"

coset = "0.3.8"
ciborium = "0.2.2"
digest = "0.10.7"
tracing = "0.1.41"
sha1 = "0.10.6"
subtle = { version = "2.6.1", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# `rand` 0.8 delegates browser entropy to `getrandom` 0.2. Enable its JS
# backend for the wasm target without adding that backend to native builds.
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
aws-lc-rs = { version = "1.18.0", optional = true }
rayon = { version = "1.12", optional = true }

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
wide = { version = "=0.7.33", default-features = false, optional = true }

[dev-dependencies]
async-signature = "0.3.0"
criterion = { version = "0.7", default-features = false }
hex = "0.4.3"
p256 = "0.13.0"
p384 = { version = "0.13.1", features = ["ecdsa"] }
p521 = { version = "0.13.3", features = ["ecdsa", "pem"] }
rand = "0.8.5"
rstest = "0.23.0"
serde_json = "1.0.145"
test-log = { version = "0.2.16", features = ["trace"] }
x509-cert = { version = "0.2.4", features = ["pem", "builder", "hazmat"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

[[test]]
name = "namespace"
path = "tests/namespace.rs"

[[test]]
name = "simulated_device_and_reader"
path = "tests/simulated_device_and_reader.rs"
required-features = ["session-key-agreement"]

[[test]]
name = "simulated_device_and_reader_state"
path = "tests/simulated_device_and_reader_state.rs"
required-features = ["session-key-agreement"]

[[bench]]
name = "mdoc_prepare"
harness = false
required-features = ["issuer-planning"]

[[bench]]
name = "digest_executor"
harness = false
required-features = ["issuer-planning"]
