[package]
name = "isomdl"
version = "0.2.0"
edition = "2021"
description = "ISO mDL implementation in Rust"
readme = "README.md"
homepage = "https://github.com/spruceid/isomdl"
repository = "https://github.com/spruceid/isomdl"
documentation = "https://docs.rs/isomdl"
license = "Apache-2.0 OR MIT"
exclude = ["test/"]

[features]
default = ["issuer-planning", "issuer-local-signing", "presentation-verifier", "session-key-agreement"]
issuer-planning = []
issuer-local-signing = ["issuer-planning", "dep:async-signature"]
presentation-verifier = []
session-key-agreement = ["presentation-verifier"]
parallel = ["dep:rayon"]
simd = ["dep:wide"]

[package.metadata.cargo-machete]
# Attribute and proc-macro references are not visible to cargo-machete.
ignored = ["serde_bytes", "strum"]

[[bin]]
name = "isomdl-utils"
path = "src/bin/utils.rs"

[dependencies]
anyhow = "1.0"
ecdsa = { version = "0.16.9", features = ["serde", "verifying"] }
p256 = { version = "0.13.0", features = ["serde", "ecdh"] }
p384 = { version = "0.13.0", features = ["serde", "ecdh"] }
rand = { version = "0.8.5", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11.0"
sha2 = { version = "0.10.8", features = ["oid"] }
thiserror = "1.0"
elliptic-curve = "0.13.1"
hkdf = "0.12.3"
aes-gcm = "0.10.1"
hmac = "0.12.1"
aes = "0.8.2"
sec1 = "0.7.1"
uuid = { version = "1.3", features = ["v1", "v4", "std", "rng", "serde", "js"] }
time = { version = "0.3.20", features = ["formatting", "parsing", "macros"] }
signature = { version = "2.0.0", features = ["std"] }
async-signature = { version = "0.3.0", optional = true }
#tracing = "0.1"
base64 = "0.13"
pem-rfc7468 = "0.7.0"
x509-cert = { version = "0.2.4", features = ["pem", "builder"] }
isomdl-macros = { version = "0.1.0", path = "macros" }
clap = { version = "4", features = ["derive"] }
clap-stdin = "0.2.1"
const-oid = "0.9.2"
der = { version = "0.7", features = ["std", "derive", "alloc"] }
hex = "0.4.3"
asn1-rs = { version = "0.5.2", features = ["bits"] }

strum = "0.24"
strum_macros = "0.24"

coset = "0.3.8"
ciborium = "0.2.2"
digest = "0.10.7"
tracing = "0.1.41"
sha1 = "0.10.6"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rayon = { version = "1.12", optional = true }

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
wide = { version = "=0.7.33", default-features = false, optional = true }

[dev-dependencies]
criterion = { version = "0.7", default-features = false }
hex = "0.4.3"
p256 = "0.13.0"
rstest = "0.23.0"
serde_json = "1.0.145"
test-log = { version = "0.2.16", features = ["trace"] }
x509-cert = { version = "0.2.4", features = ["pem", "builder", "hazmat"] }

[[bench]]
name = "mdoc_prepare"
harness = false

[[bench]]
name = "digest_executor"
harness = false
